<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>

<body>
    <header>
        <div id="recruit_head1">
            <h1>UNSC - Sistema de Reclutamiento</h1>
            <img alt="UNSC_Logo" title="UNSC Logo" src="./UNSC_Logo.png">
        </div>
        <nav>
            <button>Inicio</button>
            <button>Sobre la UNSC</button>
            <button>Ramas UNSC</button>
            <button>Proyecto Spartan</button>
        </nav>
        <img alt="UNSC recruitment image" title="Enlist now!" src="./heroImg.jpg">
    </header>
    <section class="unsc_content">
        <article class="unsc_content">
            <p>Bienvenido/a al sistema de reclutamiento de el comando espacial de las naciones unidas UNSC, si tienes
                interés en prestar servicio contra los enemigos de la humanidad y la paz diligencia el formulario de
                abajo.</p>
        </article>
        <section class="unsc_content">
            <form>
                <label for="id">ID:</label>
                <input type="text" id="id">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido">
                <label for="edad">Edad:</label>
                <input type="number" id="edad">
                <label for="peso">Peso:</label>
                <input type="number" placeholder="Peso en Kg" id="peso">
                <label for="altura">Altura:</label>
                <input type="number" placeholder="Altura en Cm" id="altura">
                <label for="rama">Desea servir en:</label>
                <select>
                    <option>Armada UNSC</option>
                    <option>Cuerpo de Marines</option>
                    <option>Ejercito</option>
                    <option>Fuerza Aerea</option>
                    <option>Cuerpo Spartan</option>
                </select>
            </form>
        </section>
    </section>
    <footer>
        <section>
            <img alt="UNSC recruitment image" title="Enlist now!" src="./UNSC_Logo.png">
        </section>
        <section>
            <p>UNSC - All rights reserved - 2552</p>
        </section>
        <section>
            <a href="#">Work with ONI</a>
            <img alt="UNSC recruitment image" title="Enlist now!" src="./ONI.png">
        </section>
    </footer>

    <script src="manipular.js"></script>
</body>

</html>
